[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bubble-sort-demo"
version = "0.1.0"
description = "A Python demonstration and side-by-side comparison of sorting algorithms with a terminal user interface (TUI) visualizer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Andrei Efimov", email = "andrei.efimov@jetbrains.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wayfarer-rus/bubble-sort-demo"
Repository = "https://github.com/wayfarer-rus/bubble-sort-demo"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
py-modules = [
    "bubble_sort",
    "selection_sort",
    "split_sort",
    "tui_visualiser",
    "main",
    "weird_count",
]
